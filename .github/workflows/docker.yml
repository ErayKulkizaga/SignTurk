name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "backend.py"
      - "database.py"
      - "models.py"
      - "live_pipeline.py"
      - "landmark_smoother.py"
      - "frontend/**"
      - "text_processing/**"
      - "tools/download_models.py"
      - "model-assets.json"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "backend.py"
      - "database.py"
      - "models.py"
      - "live_pipeline.py"
      - "landmark_smoother.py"
      - "frontend/**"
      - "text_processing/**"
      - "tools/download_models.py"
      - "model-assets.json"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sign-turk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
