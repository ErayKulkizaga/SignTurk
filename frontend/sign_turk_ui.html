<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SignTurk — Turkish Sign Language Intelligence</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  /* Light premium palette */
  --pearl:        #fbf9f5;
  --pearl-2:      #ffffff;
  --pearl-warm:   #fdfaf3;
  --frost:        #f1eee8;
  --cloud:        #e8e3d9;
  --mist:         #ddd6c8;

  --ink:          #181715;
  --ink-2:        #2c2a26;
  --ink-3:        #555149;
  --ink-muted:    #847d70;
  --ink-faint:    #b3ada1;

  --champagne:    #c9b289;
  --champagne-2:  #d8c39e;
  --gold-deep:    #a98e5e;
  --gold-soft:    rgba(201,178,137,.14);
  --gold-edge:    rgba(201,178,137,.42);

  --blue:         #7b95b3;
  --blue-deep:    #54708e;
  --blue-soft:    rgba(123,149,179,.12);
  --blue-edge:    rgba(123,149,179,.32);

  --rose:         #c89b9e;
  --sage:         #99a989;

  --success:      #62876b;
  --warn:         #c08e4e;
  --danger:       #b4625f;

  --line:         rgba(24,23,21,.07);
  --line-2:       rgba(24,23,21,.045);
  --line-strong:  rgba(24,23,21,.13);

  --glass:        rgba(255,255,255,.55);
  --glass-2:      rgba(255,255,255,.78);

  --radius-sm:    10px;
  --radius:       16px;
  --radius-lg:    22px;
  --radius-xl:    32px;

  --shadow-1:     0 6px 18px rgba(24,23,21,.04), 0 1px 2px rgba(24,23,21,.04);
  --shadow-2:     0 18px 44px rgba(24,23,21,.08), 0 2px 6px rgba(24,23,21,.04);
  --shadow-3:     0 32px 80px rgba(24,23,21,.12), 0 6px 14px rgba(24,23,21,.05);
  --shadow-glow:  0 0 60px rgba(201,178,137,.22);
  --shadow-inset: inset 0 1px 0 rgba(255,255,255,.7);

  --ease:         cubic-bezier(.22,1,.36,1);
  --ease-2:       cubic-bezier(.6,.05,.2,1);

  --serif:        'Fraunces', 'Times New Roman', serif;
  --sans:         'Inter', system-ui, sans-serif;
  --mono:         'JetBrains Mono', monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html, body, #root{ width:100%; height:100%; }
html{ scroll-behavior:smooth; }

body{
  font-family:var(--sans);
  font-size:14px;
  background:var(--pearl);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  cursor:auto;
}
body.scrollable{ overflow:auto; }
body.has-cursor{ cursor:none; }
body.has-cursor *{ cursor:none !important; }

a{ color:inherit; text-decoration:none; }
button, input, select, textarea{ font-family:inherit; }
button{ background:none; border:none; cursor:pointer; color:inherit; }
img, svg{ display:block; max-width:100%; }

::selection{ background:var(--gold-soft); color:var(--ink); }

.serif{ font-family:var(--serif); font-weight:400; letter-spacing:-0.01em; }
.serif em{ font-style:italic; font-weight:400; color:var(--gold-deep); }
.mono{ font-family:var(--mono); font-feature-settings:"tnum"; }
.eyebrow{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--ink-muted);
  font-weight:500;
}
.label{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink-muted);
}

/* ============================================================
   CUSTOM CURSOR
   ============================================================ */
.cursor-ring, .cursor-dot{
  position:fixed; top:0; left:0;
  pointer-events:none; z-index:9999;
  will-change:transform;
}
.cursor-ring{
  width:30px; height:30px;
  border:1px solid rgba(168,142,94,.55);
  border-radius:50%;
  transition: width .25s var(--ease), height .25s var(--ease), border-color .25s, opacity .25s;
  mix-blend-mode:multiply;
}
.cursor-dot{
  width:5px; height:5px;
  background:var(--champagne);
  border-radius:50%;
}
.cursor-ring.hover{
  width:54px; height:54px;
  border-color:var(--gold-deep);
  background:rgba(201,178,137,.06);
}
.cursor-ring.click{ transform-origin:center; transform:scale(.7) translate(-50%,-50%) !important; }

/* ============================================================
   AMBIENT BACKGROUND ORBS
   ============================================================ */
.ambient-bg{
  position:fixed; inset:0;
  pointer-events:none; z-index:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 14%, rgba(201,178,137,.16), transparent 38%),
    radial-gradient(circle at 84% 22%, rgba(123,149,179,.13), transparent 40%),
    radial-gradient(circle at 60% 92%, rgba(216,195,158,.10), transparent 44%),
    linear-gradient(180deg, var(--pearl) 0%, var(--frost) 100%);
}
.ambient-grid{
  position:fixed; inset:0;
  pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(24,23,21,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(24,23,21,.022) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
}
.orb{
  position:absolute; border-radius:50%;
  filter:blur(82px); opacity:.55;
  will-change:transform;
  transition:transform .9s var(--ease-2);
}

/* ============================================================
   SPLASH / BRANDED LOADER
   ============================================================ */
.splash{
  position:fixed; inset:0; z-index:9000;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg, var(--pearl) 0%, var(--frost) 100%);
  animation: splashFadeOut 1.6s 1.4s forwards var(--ease);
}
@keyframes splashFadeOut{ to{ opacity:0; visibility:hidden; } }
.splash-grid{
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(24,23,21,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(24,23,21,.03) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
}
.splash-inner{
  position:relative; z-index:1;
  text-align:center;
  animation: splashFadeIn .9s var(--ease) both;
}
@keyframes splashFadeIn{
  from{ opacity:0; transform:translateY(10px); }
  to  { opacity:1; transform:none; }
}
.splash-mark{
  font-family:var(--serif);
  font-size:64px;
  letter-spacing:-.04em;
  line-height:1;
  color:var(--ink);
  font-weight:300;
}
.splash-mark em{
  font-style:italic;
  color:var(--gold-deep);
  font-weight:400;
}
.splash-sub{
  margin-top:14px;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--ink-muted);
}
.splash-bar{
  margin:32px auto 0;
  width:160px; height:1px;
  background:var(--cloud);
  position:relative; overflow:hidden;
  border-radius:2px;
}
.splash-bar::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, var(--gold-deep), transparent);
  animation: splashBar 1.6s var(--ease) forwards;
}
@keyframes splashBar{
  from{ transform:translateX(-100%); }
  to  { transform:translateX(100%); }
}

/* ============================================================
   PAGE TRANSITION
   ============================================================ */
.page-enter{
  animation: pageEnter .55s var(--ease) both;
}
@keyframes pageEnter{
  from{ opacity:0; transform:translateY(10px); }
  to  { opacity:1; transform:none; }
}
.fade-in    { animation: fadeIn .85s var(--ease) both; }
.fade-up    { animation: fadeUp 1.05s var(--ease) both; }
.fade-up.d1 { animation-delay:.10s; }
.fade-up.d2 { animation-delay:.22s; }
.fade-up.d3 { animation-delay:.36s; }
.fade-up.d4 { animation-delay:.50s; }
.fade-in.d1 { animation-delay:.10s; }
.fade-in.d2 { animation-delay:.22s; }
.fade-in.d3 { animation-delay:.36s; }
.fade-in.d4 { animation-delay:.50s; }
.fade-in.d5 { animation-delay:.64s; }

@keyframes fadeIn{
  from{ opacity:0; }
  to  { opacity:1; }
}
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(22px); }
  to  { opacity:1; transform:none; }
}
.reveal{ opacity:0; transform:translateY(28px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.reveal.in{ opacity:1; transform:none; }

/* ============================================================
   LANDING PAGE
   ============================================================ */
.landing{
  position:relative;
  min-height:100vh;
  background:transparent;
  overflow-x:hidden;
}
.landing canvas.waves{
  position:fixed; inset:0;
  width:100%; height:100%;
  pointer-events:none; z-index:1;
  opacity:.45;
}
.landing-inner{ position:relative; z-index:2; }

.orb.l1{ width:520px; height:520px; left:-180px; top:80px; background:radial-gradient(circle, rgba(201,178,137,.34), transparent 70%); }
.orb.l2{ width:420px; height:420px; right:-100px; top:200px; background:radial-gradient(circle, rgba(123,149,179,.28), transparent 70%); }
.orb.l3{ width:340px; height:340px; left:38%; bottom:18%; background:radial-gradient(circle, rgba(216,195,158,.24), transparent 70%); }

.nav{
  position:fixed; top:0; left:0; right:0;
  z-index:80;
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 48px;
  transition: all .4s var(--ease);
  pointer-events:auto;
}
.nav.scrolled{
  padding:14px 48px;
  background:rgba(251,249,245,.78);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.nav-brand{
  display:flex; align-items:center; gap:12px;
  cursor:pointer;
  font-family:var(--serif);
  font-size:20px;
  letter-spacing:-.02em;
  color:var(--ink);
}
.brand-mark{
  width:36px; height:36px;
  border-radius:11px;
  background:linear-gradient(135deg, var(--pearl-2) 0%, var(--frost) 100%);
  border:1px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center;
  position:relative;
  box-shadow:var(--shadow-1), var(--shadow-inset);
}
.brand-mark::after{
  content:''; position:absolute; inset:3px;
  border-radius:8px;
  background:linear-gradient(135deg, var(--champagne), var(--blue));
  opacity:.16;
}
.brand-mark span{
  position:relative; z-index:1;
  font-family:var(--serif);
  font-size:18px;
  font-style:italic;
  color:var(--gold-deep);
  font-weight:500;
}
.nav-links{
  display:flex; gap:32px;
}
.nav-link{
  font-size:13px;
  color:var(--ink-3);
  cursor:pointer;
  position:relative;
  transition: color .2s;
}
.nav-link::after{
  content:''; position:absolute;
  left:0; bottom:-6px;
  width:0; height:1px;
  background:var(--gold-deep);
  transition: width .35s var(--ease);
}
.nav-link:hover{ color:var(--ink); }
.nav-link:hover::after{ width:100%; }

.nav-cta{
  font-size:13px;
  font-weight:500;
  color:var(--ink);
  padding:10px 18px;
  border:1px solid var(--line-strong);
  border-radius:999px;
  background:var(--pearl-2);
  display:inline-flex; align-items:center; gap:6px;
  transition: all .35s var(--ease);
  box-shadow:var(--shadow-1);
}
.nav-cta:hover{
  background:var(--ink);
  color:var(--pearl);
  border-color:var(--ink);
  transform: translateY(-1px);
  box-shadow:var(--shadow-2);
}
@media (max-width: 820px){ .nav-links{ display:none; } .nav{ padding:14px 22px; } .nav.scrolled{ padding:12px 22px; } }

.hero{
  padding: 180px 48px 80px;
  text-align:center;
  max-width:1280px;
  margin: 0 auto;
  position:relative;
}
.hero-tag{
  display:inline-flex; align-items:center; gap:10px;
  padding:7px 14px;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--gold-deep);
  background:var(--gold-soft);
  border:1px solid var(--gold-edge);
  border-radius:999px;
  margin-bottom:36px;
}
.hero-tag i{
  width:5px; height:5px; border-radius:50%;
  background:var(--gold-deep);
  box-shadow: 0 0 12px var(--gold-deep);
  animation: pulse 2s infinite;
}
@keyframes pulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.55; transform:scale(1.4);} }

.hero-title{
  font-family:var(--serif);
  font-size: clamp(42px, 6.2vw, 68px);
  line-height: 0.96;
  letter-spacing: -.035em;
  font-weight:300;
  color:var(--ink);
  max-width:1100px;
  margin:0 auto 26px;
}
.hero-title em{
  font-style:italic;
  color:var(--gold-deep);
  font-weight:400;
}
.hero-sub{
  max-width:660px;
  margin: 0 auto 40px;
  font-size:17px;
  line-height:1.65;
  color:var(--ink-3);
}
.hero-ctas{
  display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
  margin-bottom:96px;
}
.btn-primary{
  font-size:14px;
  font-weight:500;
  color:var(--pearl);
  background:var(--ink);
  padding:14px 26px;
  border-radius:999px;
  display:inline-flex; align-items:center; gap:10px;
  transition: all .4s var(--ease);
  box-shadow:var(--shadow-2);
  position:relative;
  overflow:hidden;
}
.btn-primary::before{
  content:''; position:absolute; inset:0;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,.18), transparent);
  transform:translateX(-120%);
  transition: transform .9s var(--ease);
}
.btn-primary:hover{ transform:translateY(-2px); box-shadow:var(--shadow-3); }
.btn-primary:hover::before{ transform:translateX(120%); }
.btn-primary span{ transition: transform .35s var(--ease); }
.btn-primary:hover span{ transform: translateX(4px); }

.btn-ghost{
  font-size:14px;
  font-weight:500;
  color:var(--ink);
  padding:14px 22px;
  border:1px solid var(--line-strong);
  border-radius:999px;
  background:var(--glass-2);
  backdrop-filter: blur(10px);
  transition: all .35s var(--ease);
  display:inline-flex; align-items:center; gap:8px;
  cursor:pointer;
}
.btn-ghost:hover{ background:var(--pearl-2); border-color:var(--ink-3); transform: translateY(-1px); }

.hero-visual{
  max-width:1080px;
  margin: 0 auto;
  perspective: 1400px;
}
.hero-card{
  border-radius:var(--radius-xl);
  padding:1px;
  background:linear-gradient(140deg, var(--gold-edge), var(--blue-edge), var(--gold-edge));
  box-shadow: var(--shadow-3), var(--shadow-glow);
  transform: rotateX(2deg);
  transition: transform .8s var(--ease);
}
.hero-card:hover{ transform: rotateX(0deg); }
.hero-card-inner{
  background:var(--pearl-2);
  border-radius: calc(var(--radius-xl) - 1px);
  padding: 36px;
  position:relative;
  overflow:hidden;
}
.hero-card-inner::before{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle at 18% 25%, rgba(201,178,137,.10), transparent 50%),
    radial-gradient(circle at 82% 70%, rgba(123,149,179,.08), transparent 50%);
  pointer-events:none;
}
.hero-grid-bg{
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(24,23,21,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(24,23,21,.04) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  pointer-events:none;
}
.hero-demo{
  position:relative; z-index:1;
  display:grid; grid-template-columns: 1fr 1.4fr;
  gap:36px; align-items:stretch;
}
@media (max-width:760px){ .hero-demo{ grid-template-columns:1fr; } }

.hero-demo-left{
  display:flex; align-items:center; justify-content:center;
  min-height:280px;
  position:relative;
}
.hero-hand{
  width:240px; height:300px; position:relative;
}
.hero-ring{
  position:absolute; inset:-20px;
  border:1px dashed var(--gold-edge);
  border-radius:50%;
  animation: rotate 28s linear infinite;
}
.hero-ring::after{
  content:''; position:absolute; inset:18px;
  border:1px dashed var(--blue-edge);
  border-radius:50%;
  animation: rotate 22s linear infinite reverse;
}
@keyframes rotate{ to { transform:rotate(360deg); } }

.hero-demo-right{ display:flex; flex-direction:column; gap:22px; justify-content:center; }
.demo-label{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ink-muted);
  margin-bottom:8px;
}
.demo-result{
  font-family:var(--serif);
  font-size: clamp(36px, 4.5vw, 56px);
  line-height:1;
  letter-spacing:-.025em;
  color:var(--ink);
  font-weight:300;
}
.demo-result em{
  font-style:italic;
  color:var(--gold-deep);
  font-weight:400;
}
.demo-meta{
  font-size:12px;
  color:var(--ink-muted);
  margin-top:10px;
}

.demo-bars{ display:flex; gap:4px; align-items:flex-end; height:38px; }
.demo-bars i{
  flex:1; background:linear-gradient(180deg, var(--champagne), var(--blue-deep));
  border-radius:1px;
  animation: barWave 1.4s var(--ease) infinite;
}
.demo-bars i:nth-child(1){ animation-delay:0s;   height:30%; }
.demo-bars i:nth-child(2){ animation-delay:.1s;  height:60%; }
.demo-bars i:nth-child(3){ animation-delay:.2s;  height:80%; }
.demo-bars i:nth-child(4){ animation-delay:.3s;  height:50%; }
.demo-bars i:nth-child(5){ animation-delay:.4s;  height:90%; }
.demo-bars i:nth-child(6){ animation-delay:.5s;  height:65%; }
.demo-bars i:nth-child(7){ animation-delay:.6s;  height:45%; }
.demo-bars i:nth-child(8){ animation-delay:.7s;  height:75%; }
.demo-bars i:nth-child(9){ animation-delay:.8s;  height:55%; }
.demo-bars i:nth-child(10){ animation-delay:.9s; height:85%; }
.demo-bars i:nth-child(11){ animation-delay:1s;  height:40%; }
.demo-bars i:nth-child(12){ animation-delay:1.1s; height:70%; }
@keyframes barWave{ 0%,100%{ transform: scaleY(.6);} 50%{ transform: scaleY(1.2);} }

.demo-topk{ display:flex; flex-direction:column; gap:7px; }
.demo-topk-row{
  display:flex; justify-content:space-between; align-items:center;
  font-size:13px;
  color:var(--ink-3);
  padding:7px 12px;
  background:var(--frost);
  border-radius:8px;
  border:1px solid var(--line);
}
.demo-topk-row:first-child{
  background:var(--gold-soft);
  border-color:var(--gold-edge);
  color:var(--ink);
  font-weight:500;
}

/* SECTIONS */
.section{
  padding: 120px 48px;
  max-width: 1280px;
  margin: 0 auto;
  position:relative;
}
.section-head{ text-align:center; max-width:720px; margin: 0 auto 60px; }
.section-eyebrow{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--gold-deep);
  margin-bottom:18px;
  padding:5px 12px;
  background:var(--gold-soft);
  border-radius:999px;
}
.section-title{
  font-family:var(--serif);
  font-size: clamp(32px, 4.6vw, 60px);
  line-height: 1.04;
  letter-spacing: -.025em;
  font-weight:300;
  color:var(--ink);
  margin-bottom: 18px;
}
.section-title em{
  font-style:italic;
  color:var(--gold-deep);
  font-weight:400;
}
.section-sub{
  font-size:16px;
  line-height:1.6;
  color:var(--ink-3);
}

.features-grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:18px;
}
@media (max-width:980px){ .features-grid{ grid-template-columns: repeat(2, 1fr); } }
@media (max-width:640px){ .features-grid{ grid-template-columns: 1fr; } }
.feature-card{
  padding:28px;
  border-radius:var(--radius-lg);
  background:var(--pearl-2);
  border:1px solid var(--line);
  box-shadow:var(--shadow-1);
  transition: all .5s var(--ease);
  position:relative;
  overflow:hidden;
}
.feature-card::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at 100% 0%, rgba(201,178,137,.10), transparent 60%);
  opacity:0; transition:opacity .5s;
}
.feature-card:hover{
  transform: translateY(-4px);
  box-shadow:var(--shadow-2);
  border-color: var(--gold-edge);

.impact-card{

    radial-gradient(ellipse at 20% 10%, rgba(201,178,137,.16), transparent 50%),

}
.auth-card::before{
  content:''; position:absolute; inset:-1px;

}
.auth-tab.active{ color:var(--ink); }
.auth-tab-indicator{
  position:absolute;

}

  display:block;
  font-family:var(--mono);

  color:var(--ink-muted);
  margin-bottom:8px;
}

  width:100%;
  padding:13px 16px;
  font-size:14px;

  color:var(--ink);

  outline:none;
}

.auth-field input:focus{
  background:var(--pearl-2);
  border-color:var(--gold-deep);
  box-shadow: 0 0 0 3px var(--gold-soft);
  transform:translateY(-1px);
}

  border-color:var(--danger);
  box-shadow: 0 0 0 3px rgba(180,98,95,.12);
}

.auth-submit{
  width:100%;
  padding:14px;
  margin-top:6px;
  font-size:14px;
  font-weight:500;

.auth-submit::before{
  content:''; position:absolute; inset:0;

.auth-spinner{

.auth-alert{

  font-size:12.5px;
  margin-bottom:16px;
  border:1px solid;

.auth-hint{

  text-transform:uppercase;
  color:var(--ink-muted);
  margin-top:2px;
}
.user-chip-exit{
  width:28px; height:28px;
  border-radius:8px;
  background:var(--pearl-2);
  border:1px solid var(--line);
  font-size:11px;
  color:var(--ink-3);
  transition: all .3s;
  flex-shrink:0;
}
.user-chip-exit:hover{ background:var(--ink); color:var(--pearl); border-color:var(--ink); }
@media (max-width:980px){ .user-chip-text, .user-chip-exit{ display:none; } .user-chip{ justify-content:center; padding:6px; } }

.nav-group-title{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--ink-faint);
  margin: 6px 8px 12px;
}
@media (max-width:980px){ .nav-group-title{ display:none; } }

.nav-list{ display:flex; flex-direction:column; gap:2px; }
.nav-list button{
  display:flex; align-items:center; gap:12px;
  padding:11px 12px;
  border-radius:11px;
  font-size:13px;
  font-weight:500;
  color:var(--ink-3);
  text-align:left;
  position:relative;
  transition: all .3s var(--ease);
}
.nav-list button:hover{ background:var(--frost); color:var(--ink); }
.nav-list button.active{
  background:var(--pearl-2);
  color:var(--ink);
  border:1px solid var(--line);
  box-shadow: var(--shadow-1);
}
.nav-list button.active::before{
  content:''; position:absolute;
  left:-20px; top:25%; height:50%;
  width:2px;
  background:var(--gold-deep);
  border-radius:2px;
}
.nav-icon{
  width:30px; height:30px;
  border-radius:9px;
  background:linear-gradient(135deg, var(--frost), var(--pearl-2));
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif);
  font-style:italic;
  font-size:13px;
  color:var(--ink-3);
  flex-shrink:0;
}
.nav-list button.active .nav-icon{
  background:linear-gradient(135deg, var(--champagne), var(--gold-deep));
  color:var(--pearl-2);
  border-color:var(--gold-deep);
  box-shadow: 0 4px 10px rgba(168,142,94,.30);
}
@media (max-width:980px){ .nav-list button span:not(.nav-icon){ display:none; } .nav-list button{ justify-content:center; padding:8px; } }

.sidebar-bottom{
  margin-top:auto;
  padding-top:18px;
  display:flex; flex-direction:column; gap:12px;
}
.mode-toggle{
  padding:11px 14px;
  background:linear-gradient(135deg, var(--frost), var(--pearl-2));
  border:1px solid var(--line);
  border-radius:11px;
  font-size:12px;
  font-weight:500;
  color:var(--ink-3);
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition: all .3s;
}
.mode-toggle:hover{ background:var(--ink); color:var(--pearl); border-color:var(--ink); }
@media (max-width:980px){ .mode-toggle{ font-size:11px; padding:8px 6px; } }

.status-card{
  padding:12px 14px;
  background:var(--pearl-2);
  border:1px solid var(--line);
  border-radius:11px;
  box-shadow: var(--shadow-1);
}
.status-row{
  display:flex; justify-content:space-between; align-items:center;
  font-size:11px;
  padding:5px 0;
  color:var(--ink-3);
}
.status-row + .status-row{ border-top:1px solid var(--line-2); }
.status-dot{
  display:inline-flex; align-items:center; gap:6px;
  font-size:10.5px; color:var(--success); font-weight:500;
}
.status-dot i{
  width:6px; height:6px; border-radius:50%;
  background:var(--success);
  box-shadow: 0 0 8px var(--success);
}
@media (max-width:980px){ .status-card{ display:none; } }

/* MAIN AREA */
.main{
  display:flex; flex-direction:column;
  overflow:hidden;
}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 36px;
  border-bottom:1px solid var(--line);
  background:rgba(251,249,245,.78);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  position:sticky; top:0; z-index:10;
}
.topbar-left h2{
  font-family:var(--serif);
  font-size:24px;
  font-weight:400;
  letter-spacing:-.018em;
  color:var(--ink);
}
.topbar-left p{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ink-muted);
  margin-top:3px;
}
.topbar-right{ display:flex; align-items:center; gap:12px; }
.chip{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  padding:6px 12px;
  border-radius:99px;
  background:var(--pearl-2);
  border:1px solid var(--line);
  color:var(--ink-3);
  display:inline-flex; align-items:center; gap:6px;
}
.chip.live{
  color:var(--gold-deep);
  background:var(--gold-soft);
  border-color:var(--gold-edge);
}
.chip.live i{
  width:5px; height:5px; border-radius:50%;
  background:var(--gold-deep);
  box-shadow: 0 0 8px var(--gold-deep);
  animation: pulse 1.6s infinite;
}
.avatar{
  width:36px; height:36px;
  border-radius:11px;
  background:linear-gradient(135deg, var(--champagne), var(--blue));
  color:var(--pearl-2);
  font-weight:500; font-size:12px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition: transform .3s;
}
.avatar:hover{ transform: scale(1.06); }

.page{
  flex:1;
  overflow-y:auto;
  background:linear-gradient(180deg, var(--pearl) 0%, var(--frost) 100%);
}
.page-container{
  max-width:1380px;
  margin: 0 auto;
  padding: 36px;
}

/* CARDS */
.card{
  background:var(--pearl-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:24px;
  box-shadow: var(--shadow-1);
  position:relative;
}
.card.hover{ transition: all .4s var(--ease); }
.card.hover:hover{
  transform: translateY(-2px);
  box-shadow: var(--shadow-2);
  border-color: var(--line-strong);
}
.card-title{
  font-family:var(--serif);
  font-size:19px;
  font-weight:400;
  letter-spacing:-.012em;
  color:var(--ink);
}
.card-sub{
  font-size:12px;
  color:var(--ink-muted);
  margin-top:3px;
  margin-bottom:16px;
}
.stack{ display:flex; flex-direction:column; gap:14px; }

.grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
@media (max-width:980px){ .grid-2{ grid-template-columns:1fr; } }
.grid-3{ display:grid; grid-template-columns: repeat(3,1fr); gap:18px; }
@media (max-width:980px){ .grid-3{ grid-template-columns: 1fr 1fr; } }
@media (max-width:640px){ .grid-3{ grid-template-columns:1fr; } }
.grid-4{ display:grid; grid-template-columns: repeat(4,1fr); gap:18px; }
@media (max-width:1100px){ .grid-4{ grid-template-columns: repeat(2,1fr); } }
@media (max-width:560px){ .grid-4{ grid-template-columns: 1fr; } }

.row-split{ display:grid; grid-template-columns: 1.4fr 1fr; gap:18px; margin-bottom:18px; }
@media (max-width:980px){ .row-split{ grid-template-columns:1fr; } }

.hero-row{
  display:grid; grid-template-columns: 1.7fr 1fr;
  gap:18px;
  margin-bottom:18px;
}
@media (max-width:980px){ .hero-row{ grid-template-columns:1fr; } }
.hero-banner{
  border-radius: var(--radius-lg);
  background: linear-gradient(140deg, var(--pearl-warm) 0%, var(--frost) 100%);
  border: 1px solid var(--line);
  padding: 1px;
  background-image: linear-gradient(140deg, var(--gold-edge) 0%, transparent 50%, var(--blue-edge) 100%);
  box-shadow: var(--shadow-2);
  overflow:hidden;
  position:relative;
}
.hero-banner-inner{
  background:linear-gradient(140deg, var(--pearl-warm) 0%, var(--pearl-2) 50%, var(--frost) 100%);
  border-radius: calc(var(--radius-lg) - 1px);
  padding: 38px;
  position:relative;
  overflow:hidden;
  height:100%;
}
.hero-banner-inner::before{
  content:''; position:absolute;
  top:-50%; right:-20%;
  width:60%; height:200%;
  background: radial-gradient(circle, rgba(201,178,137,.16), transparent 60%);
  pointer-events:none;
}
.hero-banner h3{
  font-family:var(--serif);
  font-size: clamp(28px, 3.4vw, 40px);
  line-height:1.06;
  letter-spacing:-.022em;
  font-weight:300;
  color:var(--ink);
  margin: 12px 0 14px;
  max-width: 480px;
}
.hero-banner h3 em{ font-style:italic; color:var(--gold-deep); }
.hero-banner p{
  font-size: 14px;
  line-height:1.65;
  color:var(--ink-3);
  max-width:480px;
}
.hero-banner-actions{
  margin-top:24px;
  display:flex; gap:10px;
  position:relative; z-index:1;
}

.btn{
  font-size:13px; font-weight:500;
  padding:11px 18px;
  border-radius: 999px;
  display:inline-flex; align-items:center; gap:8px;
  transition: all .35s var(--ease);
  border:1px solid transparent;
  cursor:pointer;
}
.btn.primary{ background:var(--ink); color:var(--pearl); }
.btn.primary:hover{ background:var(--ink-2); transform:translateY(-1px); box-shadow: var(--shadow-2); }
.btn.ghost{
  background:var(--pearl-2);
  color:var(--ink);
  border-color:var(--line-strong);
}
.btn.ghost:hover{ background:var(--frost); border-color:var(--ink-3); }
.btn.gold{
  background:linear-gradient(135deg, var(--champagne), var(--gold-deep));
  color:var(--pearl-2);
  box-shadow: 0 6px 16px rgba(168,142,94,.30);
}
.btn.gold:hover{ transform:translateY(-1px); box-shadow: 0 10px 24px rgba(168,142,94,.40); }

/* Stats */
.stat{ position:relative; }
.stat-label{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ink-muted);
}
.stat-value{
  font-family:var(--serif);
  font-size:32px;
  font-weight:300;
  letter-spacing:-.025em;
  color:var(--ink);
  line-height:1;
  margin-top:8px;
}
.stat-value em{ font-style:italic; color:var(--gold-deep); font-weight:400; }
.stat-sub{
  font-size:11.5px;
  color:var(--ink-muted);
  margin-top:6px;
}

.tag{
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  padding:4px 9px;
  border-radius:999px;
  border:1px solid;
  display:inline-flex; align-items:center; gap:5px;
  white-space:nowrap;
  font-weight:500;
}
.tag.gold   { color:var(--gold-deep); background:var(--gold-soft); border-color:var(--gold-edge); }
.tag.blue   { color:var(--blue-deep); background:var(--blue-soft); border-color:var(--blue-edge); }
.tag.green  { color:var(--success);  background:rgba(98,135,107,.10); border-color:rgba(98,135,107,.25); }
.tag.amber  { color:var(--warn);     background:rgba(192,142,78,.10); border-color:rgba(192,142,78,.25); }
.tag.red    { color:var(--danger);   background:rgba(180,98,95,.08);  border-color:rgba(180,98,95,.20); }
.tag.neutral{ color:var(--ink-3);    background:var(--frost); border-color:var(--line); }

/* List rows */
.list-row{
  display:flex; align-items:center; gap:12px;
  padding:11px 14px;
  background:var(--pearl);
  border:1px solid var(--line);
  border-radius:11px;
  transition: all .3s var(--ease);
}
.list-row.link{ cursor:pointer; }
.list-row:hover{ background:var(--pearl-2); transform:translateX(2px); border-color:var(--line-strong); }
.list-row > div:nth-child(2){ flex:1; min-width:0; }
.list-row h4{
  font-size:13.5px; font-weight:500; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.list-row p{
  font-size:11.5px; color:var(--ink-muted);
  margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mini-icon{
  width:34px; height:34px;
  border-radius:10px;
  background: linear-gradient(135deg, var(--frost), var(--pearl-2));
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  color:var(--ink-3);
  letter-spacing:.05em;
  flex-shrink:0;
}
.mini-icon.gold{
  background: linear-gradient(135deg, var(--champagne), var(--gold-deep));
  color:var(--pearl-2);
  border-color: var(--gold-deep);
}

/* Skeleton */
.skeleton{
  background: linear-gradient(90deg, var(--frost) 0%, var(--cloud) 50%, var(--frost) 100%);
  background-size: 200% 100%;
  border-radius: 10px;
  animation: skel 1.4s var(--ease) infinite;
}
@keyframes skel{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }

/* Empty state */
.empty-state{
  padding: 60px 20px;
  text-align:center;
}
.empty-state .big{
  font-family:var(--serif);
  font-size: 60px;
  font-style:italic;
  color: var(--gold-deep);
  font-weight:300;
  line-height:1;
  margin-bottom: 14px;
  opacity:.6;
}
.empty-state h4{
  font-family:var(--serif);
  font-size: 22px;
  font-weight:400;
  letter-spacing:-.015em;
  color:var(--ink);
  margin-bottom:8px;
}
.empty-state p{
  font-size:13px;
  color:var(--ink-muted);
  max-width:380px;
  margin: 0 auto;
  line-height:1.6;
}

/* Tables */
.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.table th{
  text-align:left;
  padding: 10px 14px;
  font-family:var(--mono);
  font-size:9.5px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ink-muted);
  font-weight:500;
  border-bottom:1px solid var(--line);
  background:var(--frost);
}
.table tr:first-child th:first-child{ border-top-left-radius:10px; }
.table tr:first-child th:last-child{ border-top-right-radius:10px; }
.table td{
  padding: 12px 14px;
  border-bottom:1px solid var(--line-2);
  color:var(--ink-3);
  vertical-align:middle;
}
.table tbody tr{ transition: background .2s; }
.table tbody tr:hover{ background:var(--pearl); }
.table .strong{ color:var(--ink); font-weight:500; }

/* Search inputs */
.search{
  width:100%;
  padding:11px 16px;
  font-size:13px;
  background:var(--pearl);
  border:1px solid var(--line-strong);
  border-radius:11px;
  color:var(--ink);
  transition: all .3s var(--ease);
  outline:none;
}
.search::placeholder{ color:var(--ink-faint); }
.search:focus{
  background:var(--pearl-2);
  border-color: var(--gold-deep);
  box-shadow: 0 0 0 3px var(--gold-soft);
}

/* Charts wrap */
.chart-wrap{
  height: 200px;
  margin-top: 8px;
  background: var(--pearl);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  position:relative;
}
.chart-wrap svg{ width:100%; height:100%; }

/* Activity */
.activity{ display:flex; flex-direction:column; gap:2px; max-height:340px; overflow-y:auto; padding-right:4px; }
.activity-item{
  display:flex; gap:14px; align-items:flex-start;
  padding: 10px 12px;
  border-radius: 10px;
  position:relative;
  transition: background .2s;
}
.activity-item:hover{ background:var(--frost); }
.activity-dot{
  width:8px; height:8px;
  border-radius:50%;
  margin-top:6px;
  flex-shrink:0;
  box-shadow: 0 0 0 4px rgba(255,255,255,.6);
}
.activity-item > div:nth-child(2){ flex:1; min-width:0; }
.activity-item h5{
  font-size:13px; font-weight:500; color:var(--ink);
  margin-bottom:2px;
}
.activity-item p{
  font-size:11.5px; color:var(--ink-muted);
}
.activity-item time{
  font-family:var(--mono);
  font-size:10px;
  color:var(--ink-faint);
  white-space:nowrap;
  flex-shrink:0;
}

/* ============================================================
   LIVE TRANSLATION PAGE
   ============================================================ */
.live-shell{
  display:grid;
  grid-template-columns: 1.5fr 1fr;
  gap:18px;
}
@media (max-width:1100px){ .live-shell{ grid-template-columns:1fr; } }

.camera-stage{ position:relative; }
.camera-frame{
  position:relative;
  border-radius: var(--radius-lg);
  overflow:hidden;
  background: linear-gradient(135deg, #1a1916 0%, #2d2a25 100%);
  aspect-ratio: 16/10;
  border:1px solid var(--line);
  box-shadow: var(--shadow-3);
}
.camera-frame video{
  width:100%; height:100%;
  object-fit:cover;
  transform: scaleX(-1);
}
.camera-grid-bg{
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none;
}
.camera-overlay{
  position:absolute; inset:0;
  pointer-events:none;
}
.camera-vignette{
  position:absolute; inset:0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.35) 100%);
}
.camera-scan{
  position:absolute;
  left:0; right:0;
  height:2px;
  background: linear-gradient(90deg, transparent, var(--champagne), transparent);
  opacity:.7;
  animation: scan 3.4s var(--ease) infinite;
  box-shadow: 0 0 20px var(--champagne);
}
@keyframes scan{
  0%{ top:0; }
  50%{ top: 100%; }
  100%{ top:0; }
}
.camera-corners i{
  position:absolute;
  width:22px; height:22px;
  border-color:var(--champagne);
  border-style:solid; border-width:0;
}
.camera-corners i:nth-child(1){ top:18px; left:18px; border-top-width:1.5px; border-left-width:1.5px; }
.camera-corners i:nth-child(2){ top:18px; right:18px; border-top-width:1.5px; border-right-width:1.5px; }
.camera-corners i:nth-child(3){ bottom:18px; left:18px; border-bottom-width:1.5px; border-left-width:1.5px; }
.camera-corners i:nth-child(4){ bottom:18px; right:18px; border-bottom-width:1.5px; border-right-width:1.5px; }

.camera-center{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
}
.camera-placeholder{
  text-align:center;
  color:rgba(255,255,255,.85);
  max-width:320px;
}
.camera-placeholder .big{
  font-family:var(--serif);
  font-style:italic;
  font-size:80px;
  font-weight:300;
  color:var(--champagne);
  line-height:1;
  margin-bottom:16px;
  opacity:.85;
}
.camera-placeholder h4{
  font-family:var(--serif);
  font-size:24px;
  font-weight:400;
  letter-spacing:-.015em;
  color:#fdfaf3;
  margin-bottom:8px;
}
.camera-placeholder p{
  font-size:13px;
  color:rgba(255,255,255,.6);
  line-height:1.6;
}

.camera-hud{
  position:absolute; top:18px; left:18px; right:18px;
  display:flex; justify-content:space-between; align-items:center;
  gap:10px;
  pointer-events:none;
}
.hud-pill{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  padding:6px 11px;
  border-radius:99px;
  background:rgba(0,0,0,.4);
  backdrop-filter: blur(10px);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.78);
  display:inline-flex; align-items:center; gap:6px;
}
.hud-pill.on{
  color:var(--champagne);
  border-color: rgba(201,178,137,.4);
}
.hud-pill.on i{
  width:6px; height:6px; border-radius:50%;
  background:var(--champagne);
  box-shadow: 0 0 10px var(--champagne);
  animation: pulse 1.6s infinite;
}

.camera-footer{
  position:absolute;
  bottom:18px; left:18px; right:18px;
  display:flex; justify-content:space-between; align-items:center;
  gap:14px;
  pointer-events:none;
}
.camera-controls{ pointer-events:auto; }
.ctrl-btn{
  font-family:var(--sans);
  font-weight:500;
  font-size:13px;
  padding:11px 20px;
  border-radius:99px;
  display:inline-flex; align-items:center; gap:8px;
  transition: all .4s var(--ease);
  cursor:pointer;
}
.ctrl-btn.go{
  background:linear-gradient(135deg, var(--champagne), var(--gold-deep));
  color:var(--pearl-2);
  box-shadow: 0 8px 20px rgba(168,142,94,.5);
}
.ctrl-btn.go:hover{ transform: translateY(-1px); box-shadow: 0 12px 28px rgba(168,142,94,.6); }
.ctrl-btn.stop{
  background:#fff;
  color:var(--ink);

      adminModel:    "/api/admin/model",
      login:         "/api/auth/login",
      register:      "/api/auth/register"
    }
  };

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, useLayoutEffect } = React;

/* ============================================================
   CUSTOM CURSOR — premium ring + dot, magnetic on [data-magnet]
   ============================================================ */
function CustomCursor(){
  const ringRef = useRef(null);
  const dotRef  = useRef(null);
  useEffect(() => {
    const isTouch = matchMedia('(pointer:coarse)').matches;
    if (isTouch) return;
    document.body.classList.add('has-cursor');

    const target = { x: window.innerWidth/2, y: window.innerHeight/2 };
    const ring   = { x: target.x, y: target.y };
    const dot    = { x: target.x, y: target.y };
    let raf = null;

    const onMove = (e) => { target.x = e.clientX; target.y = e.clientY; };
    const onDown = () => ringRef.current && ringRef.current.classList.add('click');
    const onUp   = () => ringRef.current && ringRef.current.classList.remove('click');

    const enterables = 'a, button, [role="button"], [data-magnet], input, select, textarea, .nav-list button, .topk-row, .list-row, .feature-card, .tag, .pipeline-step';
    const onOver = (e) => {
      if (e.target.closest(enterables)) ringRef.current?.classList.add('hover');
    };
    const onOut  = (e) => {
      if (e.target.closest(enterables)) ringRef.current?.classList.remove('hover');
    };

    const tick = () => {
      ring.x += (target.x - ring.x) * 0.16;
      ring.y += (target.y - ring.y) * 0.16;
      dot.x  += (target.x - dot.x)  * 0.45;
      dot.y  += (target.y - dot.y)  * 0.45;
      if (ringRef.current) ringRef.current.style.transform = `translate(${ring.x - 15}px, ${ring.y - 15}px)`;
      if (dotRef.current)  dotRef.current.style.transform  = `translate(${dot.x - 2.5}px, ${dot.y - 2.5}px)`;
      raf = requestAnimationFrame(tick);
    };
    tick();

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mousedown', onDown);
    window.addEventListener('mouseup',   onUp);
    document.addEventListener('mouseover', onOver);
    document.addEventListener('mouseout',  onOut);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mousedown', onDown);
      window.removeEventListener('mouseup',   onUp);
      document.removeEventListener('mouseover', onOver);
      document.removeEventListener('mouseout',  onOut);
      document.body.classList.remove('has-cursor');
    };
  }, []);
  return (
    <>
      <div ref={ringRef} className="cursor-ring" />
      <div ref={dotRef}  className="cursor-dot" />
    </>
  );
}

/* ============================================================
   HASH ROUTING + STORED USER (refresh persistence)
   ============================================================ */
function useHashRoute(){
  const read = () => (window.location.hash || '').replace(/^#\/?/, '') || 'home';
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const on = () => setRoute(read());
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const navigate = useCallback((to) => {
    const target = '#/' + to.replace(/^\//,'');
    if (window.location.hash !== target) window.location.hash = target;
  }, []);
  return [route, navigate];
}

function useStoredUser(){
  const [user, setUserState] = useState(() => {
    try { return JSON.parse(localStorage.getItem('tsl_user') || 'null'); } catch { return null; }
  });
  const setUser = useCallback((u) => {
    if (u) localStorage.setItem('tsl_user', JSON.stringify(u));
    else   localStorage.removeItem('tsl_user');
    setUserState(u);
  }, []);
  return [user, setUser];
}

async function authFetch(input, init={}){
  const options = {...init};
  const headers = new Headers(init.headers || {});
  try{
    const user = JSON.parse(localStorage.getItem('tsl_user') || 'null');
    if (user?.access_token) headers.set('Authorization', `Bearer ${user.access_token}`);
  } catch {}
  options.headers = headers;
  const response = await fetch(input, options);
  if (response.status === 401){
    localStorage.removeItem('tsl_user');
  }
  return response;
}

/* ============================================================
   GLOBAL MOUSE PARALLAX (subtle background shift)
   ============================================================ */
function useMouseParallax(){
  useEffect(() => {
    if (matchMedia('(pointer:coarse)').matches) return;
    let raf = null;
    const onMove = (e) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const x = (e.clientX / window.innerWidth  - 0.5) * 2;
        const y = (e.clientY / window.innerHeight - 0.5) * 2;
        document.documentElement.style.setProperty('--mx', x.toFixed(3));
        document.documentElement.style.setProperty('--my', y.toFixed(3));
        raf = null;
      });
    };
    window.addEventListener('mousemove', onMove, { passive:true });
    return () => window.removeEventListener('mousemove', onMove);
  }, []);
}

/* ============================================================
   ELEGANT QUANTUM WAVES — flowing neural ribbons (canvas)
   ============================================================ */
function QuantumWaves({ density=4, mouse=true }){
  const cvRef = useRef(null);
  useEffect(() => {
    const canvas = cvRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let raf = null, t0 = performance.now();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const mx = { x: 0.5, y: 0.5 };

    const resize = () => {
      const r = canvas.getBoundingClientRect();
      canvas.width  = r.width  * dpr;
      canvas.height = r.height * dpr;
      ctx.setTransform(dpr,0,0,dpr,0,0);
    };
    resize();

    const onMove = (e) => {
      const r = canvas.getBoundingClientRect();
      mx.x = (e.clientX - r.left) / r.width;
      mx.y = (e.clientY - r.top)  / r.height;
    };
    if (mouse) window.addEventListener('mousemove', onMove);
    window.addEventListener('resize', resize);

    const palette = [
      'rgba(201,178,137,', // champagne
      'rgba(123,149,179,', // blue
      'rgba(168,142,94,',  // gold-deep
      'rgba(216,195,158,', // champagne-2
    ];

    const draw = (now) => {
      const t = (now - t0) / 1000;
      const w = canvas.width  / dpr;
      const h = canvas.height / dpr;
      ctx.clearRect(0,0,w,h);

      const ribbons = density;
      for (let r = 0; r < ribbons; r++){
        const phase = r * 0.7 + t * 0.45;
        const amp   = h * 0.12 * (1 + (mouse ? (mx.y - 0.5) * 0.4 : 0));
        const baseY = h * (0.25 + r * 0.18);
        const colorBase = palette[r % palette.length];
        const alpha = 0.10 + (r % 2) * 0.04;

        ctx.beginPath();
        ctx.moveTo(0, baseY);
        for (let x = 0; x <= w; x += 8){
          const px = x / w;
          const y = baseY
            + Math.sin(px * 6 + phase)        * amp
            + Math.sin(px * 11 + phase * 1.6) * amp * 0.4
            + (mouse ? (mx.x - 0.5) * 30 * Math.sin(px * 4 + phase) : 0);
          ctx.lineTo(x, y);
        }
        const grad = ctx.createLinearGradient(0,0,w,0);
        grad.addColorStop(0,    colorBase + '0)');
        grad.addColorStop(0.25, colorBase + alpha + ')');
        grad.addColorStop(0.75, colorBase + alpha + ')');
        grad.addColorStop(1,    colorBase + '0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.1;
        ctx.stroke();

        // Twin ribbon offset
        ctx.beginPath();
        ctx.moveTo(0, baseY + 8);
        for (let x = 0; x <= w; x += 8){
          const px = x / w;
          const y = baseY + 8
            + Math.sin(px * 6 + phase + 0.6) * amp * 0.85
            + Math.sin(px * 11 + phase * 1.6 + 0.6) * amp * 0.36;
          ctx.lineTo(x, y);
        }
        ctx.strokeStyle = grad;
        ctx.lineWidth = 0.7;
        ctx.globalAlpha = 0.8;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      if (mouse) window.removeEventListener('mousemove', onMove);
    };
  }, [density, mouse]);
  return <canvas ref={cvRef} className="waves" />;
}

/* ============================================================
   PARALLAX ORBS — mouse-reactive
   ============================================================ */
function ParallaxOrbs({ children }){
  const ref = useRef(null);
  useEffect(() => {
    if (matchMedia('(pointer:coarse)').matches) return;
    let raf = null;
    const onMove = (e) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        const orbs = ref.current?.querySelectorAll('.orb, .auth-orb');
        if (orbs){
          orbs.forEach((o, i) => {
            const factor = (i + 1) * 6;
            const x = (e.clientX / window.innerWidth  - 0.5) * factor;
            const y = (e.clientY / window.innerHeight - 0.5) * factor;
            o.style.transform = `translate(${x}px, ${y}px)`;
          });
        }
        raf = null;
      });
    };
    window.addEventListener('mousemove', onMove, { passive:true });
    return () => window.removeEventListener('mousemove', onMove);
  }, []);
  return <div ref={ref}>{children}</div>;
}

/* ============================================================
   REVEAL ON SCROLL
   ============================================================ */
function Reveal({ children, delay=0, className='' }){
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting){ setTimeout(() => el.classList.add('in'), delay); io.unobserve(el); }
      });
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, [delay]);
  return <div ref={ref} className={`reveal ${className}`}>{children}</div>;
}

/* ============================================================
   MAGNETIC HOVER — attaches gentle pull to [data-magnet]
   ============================================================ */
function useMagnets(){
  useEffect(() => {
    if (matchMedia('(pointer:coarse)').matches) return;
    const els = Array.from(document.querySelectorAll('[data-magnet]'));
    const handlers = [];
    els.forEach(el => {
      let raf = null;
      const onMove = (e) => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          const r = el.getBoundingClientRect();
          const dx = e.clientX - (r.left + r.width / 2);
          const dy = e.clientY - (r.top  + r.height / 2);
          el.style.transform = `translate(${dx * 0.16}px, ${dy * 0.22}px)`;
          raf = null;
        });
      };
      const onLeave = () => { el.style.transform = ''; };
      el.addEventListener('mousemove', onMove);
      el.addEventListener('mouseleave', onLeave);
      handlers.push([el, onMove, onLeave]);
    });
    return () => handlers.forEach(([el, m, l]) => {
      el.removeEventListener('mousemove', m);
      el.removeEventListener('mouseleave', l);
    });
  });
}

/* ============================================================
   SPLASH
   ============================================================ */
function Splash(){
  return (
    <div className="splash">
      <div className="splash-grid" />
      <div className="splash-inner">
        <div className="splash-mark">Sign<em>Turk</em></div>
        <div className="splash-sub">Sign Language Intelligence</div>
        <div className="splash-bar" />
      </div>
    </div>
  );
}

/* ============================================================
   LANDING PAGE
   ============================================================ */
function LandingPage({ onLaunch }){
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    document.body.classList.add('scrollable');
    const onScroll = () => setScrolled(window.scrollY > 18);
    window.addEventListener('scroll', onScroll);
    return () => { document.body.classList.remove('scrollable'); window.removeEventListener('scroll', onScroll); };
  }, []);
  useMagnets();

  return (

/* ============================================================
   AUTH SCREEN — split-screen with quantum waves
   ============================================================ */
function AuthScreen({ onAuth, onBack }){
  const [tab, setTab] = useState('login');
  const [form, setForm] = useState({ full_name:'', email:'', password:'', confirm:'' });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [ok,  setOk]  = useState('');
  const set = (k) => (e) => { setForm(f => ({ ...f, [k]: e.target.value })); setErr(''); setOk(''); };
  useMagnets();

  const login = async () => {
    if (!form.email || !form.password) return setErr('Please fill in all fields.');
    setLoading(true); setErr('');
    try{
      const res = await authFetch(window.TSL_API.baseUrl + window.TSL_API.endpoints.login, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: form.email, password: form.password })
      });
      const data = await res.json();
      if (!res.ok) return setErr(data.error || 'Sign in failed.');
      onAuth({...data.user, access_token:data.access_token});
    } catch {
      setErr('Cannot reach server. Please ensure the backend is running.');
    } finally { setLoading(false); }
  };

  const register = async () => {
    if (!form.full_name || !form.email || !form.password) return setErr('All fields are required.');
    if (form.password !== form.confirm) return setErr('Passwords do not match.');
    if (form.password.length < 8) return setErr('Password must be at least 8 characters.');
    setLoading(true); setErr(''); setOk('');
    try{
      const res = await authFetch(window.TSL_API.baseUrl + window.TSL_API.endpoints.register, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ full_name: form.full_name, email: form.email, password: form.password })
      });
      const data = await res.json();
      if (!res.ok) return setErr(data.error || 'Registration failed.');
      setOk('Account created. You may now sign in.');
      setForm(f => ({ ...f, password:'', confirm:'', full_name:'' }));
      setTimeout(() => setTab('login'), 1400);
    } catch {
      setErr('Cannot reach server.');
    } finally { setLoading(false); }
  };

  return (
    <div className="auth page-enter">
      <div className="auth-left">
        <QuantumWaves density={5} mouse={true} />
        <div className="auth-grid-bg" />
        <ParallaxOrbs>
          <div className="auth-orb a1" />
          <div className="auth-orb a2" />
        </ParallaxOrbs>

        <div className="auth-brand fade-in">
          <div className="brand-mark"><span>S</span></div>
          <div className="auth-brand-text">
            <h1>SignTurk</h1>
            <p>Sign Language AI</p>
          </div>
        </div>

        <div className="auth-hero">
          <div className="auth-hero-tag fade-in"><i/>Türk İşaret Dili Intelligence</div>
          <h2 className="fade-in d1">A <em>quieter</em><br/>way to be <em>heard</em>.</h2>
          <p className="fade-in d2">A luxury-grade platform for Turkish Sign Language — real-time recognition, 179 signs, designed for presence and precision.</p>
        </div>

        <div className="auth-features">
          {[
            {m:'L', t:'Live Recognition', d:'Real-time camera inference with BiLSTM attention.'},
            {m:'A', t:'Avatar Mapping',   d:'Two-way communication via animation playback.'},
            {m:'S', t:'Account Access',  d:'Hashed passwords, bearer sessions, persisted history.'},
          ].map((f,i) => (
            <div key={f.m} className={`auth-feature fade-in d${i+3}`}>
              <div className="auth-feature-mark">{f.m}</div>
              <div className="auth-feature-text">
                <strong>{f.t}</strong>
                <span>{f.d}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="auth-right">
        {onBack && <div className="auth-back" onClick={onBack}>← Back to home</div>}
        <div className="auth-card fade-in">
          <div className="auth-tabs">
            <div className={`auth-tab-indicator ${tab==='register' ? 'right' : ''}`} />
            <button className={`auth-tab ${tab==='login'?'active':''}`}    onClick={() => { setTab('login');    setErr(''); setOk(''); }}>Sign In</button>
            <button className={`auth-tab ${tab==='register'?'active':''}`} onClick={() => { setTab('register'); setErr(''); setOk(''); }}>Create Account</button>
          </div>

          {tab === 'login' ? (
            <div className="fade-in" key="login">
              <h2 className="auth-form-title">Welcome <em>back</em>.</h2>
              <p className="auth-form-sub">Sign in to continue your session.</p>
              {err && <div className="auth-alert err">{err}</div>}
              {ok  && <div className="auth-alert ok">{ok}</div>}
              <div className="auth-field">
                <label>Email</label>
                <input type="email" placeholder="name@organization.com" value={form.email}
                       onChange={set('email')} className={err && !form.email ? 'error':''}
                       onKeyDown={e => e.key==='Enter' && login()} />
              </div>
              <div className="auth-field">
                <label>Password</label>
                <input type="password" placeholder="••••••••" value={form.password}
                       onChange={set('password')} className={err && !form.password ? 'error':''}
                       onKeyDown={e => e.key==='Enter' && login()} />
              </div>
              <button className="auth-submit" onClick={login} disabled={loading} data-magnet>
                {loading ? <><div className="auth-spinner"/><span>Authenticating</span></> : <span>Sign In →</span>}
              </button>
              <div className="auth-hint">Create an account, or configure an admin through environment variables.</div>
            </div>
          ) : (
            <div className="fade-in" key="register">
              <h2 className="auth-form-title">Create an <em>account</em>.</h2>
              <p className="auth-form-sub">Register to access SignTurk.</p>
              {err && <div className="auth-alert err">{err}</div>}
              {ok  && <div className="auth-alert ok">{ok}</div>}
              <div className="auth-field"><label>Full name</label><input type="text" placeholder="Jane Doe" value={form.full_name} onChange={set('full_name')} /></div>
              <div className="auth-field"><label>Email</label><input type="email" placeholder="name@organization.com" value={form.email} onChange={set('email')} /></div>
              <div className="auth-field"><label>Password</label><input type="password" placeholder="Choose a password" value={form.password} onChange={set('password')} /></div>
              <div className="auth-field"><label>Confirm Password</label><input type="password" placeholder="Repeat password" value={form.confirm} onChange={set('confirm')} onKeyDown={e => e.key==='Enter' && register()} /></div>
              <button className="auth-submit" onClick={register} disabled={loading} data-magnet>
                {loading ? <><div className="auth-spinner"/><span>Processing</span></> : <span>Create Account →</span>}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

        </div>
        {tag && <span className={`tag ${tag.color}`}>{tag.text}</span>}
      </div>
    </div>
  );
}

function Toast({ message, onDone }){

}

/* ============================================================
   LIVE TRANSLATION
   ============================================================ */
function LivePage(){
  const [liveResult, setLiveResult] = useState(null);
  const [status, setStatus]         = useState('Idle');
  const [connected, setConnected]   = useState(false);
  const [recent, setRecent]         = useState([]);
  // ── ✓/✗ approval + sentence strip ──────────────────────────────
  const [pending, setPending]             = useState(null);  // {word,label_en}
  const [sentenceWords, setSentenceWords] = useState([]);    // approved words
  const [sentence, setSentence]           = useState('');    // assembled sentence
  const wsRef       = useRef(null);
  const videoRef    = useRef(null);
  const streamRef   = useRef(null);
  const canvasRef   = useRef(null);
  const intervalRef = useRef(null);
  const inFlightRef = useRef(false);
  useMagnets();

  const captureFrame = () => {
    const v = videoRef.current, c = canvasRef.current;
    if (!v || !c || v.videoWidth === 0) return null;
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    return c.toDataURL('image/jpeg', 0.7);
  };

  const startCamera = async () => {
    try{
      const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      streamRef.current = s;
      if (videoRef.current) videoRef.current.srcObject = s;
      setStatus('Camera active');
    } catch { setStatus('Camera access denied'); }
  };

  const stopCamera = () => {
    if (streamRef.current){ streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    if (videoRef.current) videoRef.current.srcObject = null;
  };

  const startLive = async () => {
    await startCamera();
    if (wsRef.current && (wsRef.current.readyState === WebSocket.OPEN || wsRef.current.readyState === WebSocket.CONNECTING)) return;
    setStatus('Connecting…');
    const stored = JSON.parse(localStorage.getItem('tsl_user') || 'null');
    const token = stored?.access_token ? `?token=${encodeURIComponent(stored.access_token)}` : '';
    wsRef.current = new WebSocket(window.TSL_API.wsUrl + window.TSL_API.endpoints.live + token);
    wsRef.current.onopen = () => {
      setConnected(true); setStatus('Connected');
      intervalRef.current = setInterval(() => {
        if (inFlightRef.current) return;
        const f = captureFrame();
        if (f && wsRef.current?.readyState === WebSocket.OPEN) {
          inFlightRef.current = true;
          wsRef.current.send(f);
        }
      }, 250);
    };
    wsRef.current.onmessage = (e) => {
      inFlightRef.current = false;
      const d = JSON.parse(e.data);
      // ── approval / sentence-strip control replies ───────────────
      if (d.type === 'sentence_update'){
        setSentenceWords(d.words || []);
        setSentence(d.sentence || '');
        setPending(null);
        return;
      }
      if (d.type === 'rejected'){ setPending(null); return; }
      if (d.class_id === -1){ setStatus(d.label_tr || 'Processing…'); return; }
      setLiveResult(d);
      // Only confident signs become an approval candidate the user can confirm.
      if (d.above_threshold && d.pending_word){
        setPending({ word: d.pending_word, label_en: d.label_en });
      }
      if (d.confidence >= 0.4) setRecent(p => [d, ...p].slice(0, 8));
      setStatus('Recognizing');
    };
    wsRef.current.onerror = () => { inFlightRef.current = false; setStatus('Connection error'); };
    wsRef.current.onclose = () => { inFlightRef.current = false; setConnected(false); setStatus('Disconnected'); };
  };

  const stopLive = () => {
    if (intervalRef.current){ clearInterval(intervalRef.current); intervalRef.current = null; }
    inFlightRef.current = false;
    if (wsRef.current){ wsRef.current.close(); wsRef.current = null; }
    stopCamera();
    setConnected(false);
    setStatus('Idle');
    setPending(null);
  };

  // ── ✓/✗ approval controls ──────────────────────────────────────
  const sendAction = (obj) => {
    const ws = wsRef.current;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  };
  // "Doğru": persist the word and append it to the sentence strip.
  const approveWord  = () => { if (pending) sendAction({ action:'approve', word: pending.word }); };
  // "Yanlış": discard the candidate, nothing is saved.
  const rejectWord   = () => { setPending(null); sendAction({ action:'reject' }); };
  const undoWord     = () => sendAction({ action:'undo' });
  const resetSentence= () => sendAction({ action:'reset_sentence' });

  useEffect(() => () => {
    if (intervalRef.current) clearInterval(intervalRef.current);
    inFlightRef.current = false;
    if (wsRef.current) wsRef.current.close();
    stopCamera();
  }, []);

  const pct = liveResult ? Math.round(liveResult.confidence * 100) : 0;
  const ringR = 32;
  const ringC = 2 * Math.PI * ringR;
  const ringOffset = ringC - (pct / 100) * ringC;

  return (
    <div className="page page-enter"><div className="page-container">
      <div className="live-shell">
        <div className="camera-stage">
          <div className="camera-frame">
            <div className="camera-grid-bg" />
            <video ref={videoRef} autoPlay playsInline muted style={{opacity: streamRef.current ? 1 : 0, transition:'opacity .5s var(--ease)'}} />
            <canvas ref={canvasRef} style={{display:'none'}} />
            <div className="camera-overlay">
              <div className="camera-vignette" />
              {connected && <div className="camera-scan" />}
              <div className="camera-corners"><i/><i/><i/><i/></div>
            </div>
            {!streamRef.current && (
              <div className="camera-center">
                <div className="camera-placeholder">
                  <div className="big">N</div>
                  <h4>Camera idle</h4>
                  <p>Click <strong style={{color:'var(--champagne)'}}>Start</strong> to activate your camera and begin live sign recognition.</p>
                </div>
              </div>
            )}
            <div className="camera-hud">
              <div className={`hud-pill ${connected?'on':''}`}><i/>{connected?'LIVE':'OFFLINE'}</div>
              <div className="hud-pill">ws · 250ms · 16 frames</div>
            </div>
            <div className="camera-footer">
              <div className="camera-controls">
                {!connected ? (
                  <button className="ctrl-btn go" onClick={startLive} data-magnet>● Start Recognition</button>
                ) : (
                  <button className="ctrl-btn stop" onClick={stopLive} data-magnet>■ Stop</button>
                )}
              </div>
              {connected && (
                <div className="wave-mini">
                  {Array.from({length:7}).map((_,i) => <i key={i}/>)}
                </div>
              )}
            </div>
          </div>
        </div>

        <div className="stack">
          <div className="result-card">
            <div className="result-card-inner">
              <div className="label">Detected Sign</div>
              <div className="result-big">{liveResult?.label_tr ? <>{liveResult.label_tr}<em>.</em></> : '—'}</div>
              <div className="result-en">{liveResult?.label_en || status}</div>
              <div className="result-meta">
                <div>
                  <div className="label" style={{marginBottom:4}}>Confidence</div>
                  <div className="mono" style={{fontSize:12,color:'var(--ink-3)'}}>class_id · {liveResult?.class_id ?? '—'}</div>
                </div>
                <div className="result-conf-ring">
                  <svg viewBox="0 0 80 80">
                    <defs>
                      <linearGradient id="confGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%"   stopColor="#c9b289"/>
                        <stop offset="100%" stopColor="#7b95b3"/>
                      </linearGradient>
                    </defs>
                    <circle className="bg" cx="40" cy="40" r={ringR}/>
                    <circle className="fg" cx="40" cy="40" r={ringR} strokeDasharray={ringC} strokeDashoffset={ringOffset}/>
                  </svg>
                  <div className="pct">{pct}<em>%</em></div>
                </div>
              </div>

              {/* ── ✓/✗ approval: only confirmed words are saved ── */}
              {pending && connected && (
                <div style={{marginTop:16}}>
                  <div className="label" style={{marginBottom:8}}>
                    “{pending.word}” doğru mu?
                  </div>
                  <div style={{display:'flex',gap:10}}>
                    <button onClick={approveWord} data-magnet
                      style={{flex:1,padding:'12px 14px',border:'none',borderRadius:12,cursor:'pointer',
                        fontWeight:600,fontSize:14,color:'#0c2a16',
                        background:'linear-gradient(135deg,#7fd99a,#3fae6a)'}}>
                      ✓ Doğru
                    </button>
                    <button onClick={rejectWord} data-magnet
                      style={{flex:1,padding:'12px 14px',borderRadius:12,cursor:'pointer',
                        fontWeight:600,fontSize:14,color:'#e0a3a3',
                        border:'1px solid rgba(200,80,80,.4)',background:'rgba(200,80,80,.08)'}}>
                      ✗ Yanlış
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* ── Cümle Şeridi (sentence strip) ── */}
          <div className="card">
            <div className="card-title">Cümle Şeridi</div>
            <div className="card-sub">Onaylanan kelimeler · {sentenceWords.length}</div>
            {sentenceWords.length === 0 ? (
              <div style={{padding:'14px 0',fontSize:12,color:'var(--ink-muted)'}}>
                Bir işaret algılandığında <strong style={{color:'var(--champagne)'}}>✓ Doğru</strong> ile kelimeyi şeride ekleyin.
              </div>
            ) : (
              <>
                <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>
                  {sentenceWords.map((w,i) => (
                    <span key={i} style={{padding:'5px 11px',borderRadius:999,fontSize:13,color:'var(--ink)',
                      background:'rgba(201,178,137,.14)',border:'1px solid rgba(201,178,137,.32)'}}>{w}</span>
                  ))}
                </div>
                <div className="serif" style={{fontSize:19,color:'var(--ink)',lineHeight:1.4}}>{sentence || '—'}</div>
                <div style={{display:'flex',gap:8,marginTop:14}}>
                  <button onClick={undoWord}
                    style={{padding:'7px 12px',borderRadius:10,cursor:'pointer',fontSize:12,
                      border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)'}}>↶ Geri al</button>
                  <button onClick={resetSentence}
                    style={{padding:'7px 12px',borderRadius:10,cursor:'pointer',fontSize:12,
                      border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)'}}>Temizle</button>
                </div>
              </>
            )}
          </div>

          <div className="card">
            <div className="card-title">Top Predictions</div>
            <div className="card-sub">Ranked by softmax confidence</div>
            {liveResult?.top_predictions?.length > 0 ? (
              <div className="topk">
                {liveResult.top_predictions.map((p, i) => (
                  <div className="topk-row" key={i}>
                    <span className="rank">{['I','II','III','IV','V'][i]}</span>
                    <div className="words"><strong>{p.label_tr}</strong><span>{p.label_en}</span></div>
                    <span className="pct">{(p.confidence*100).toFixed(1)}%</span>
                  </div>
                ))}
              </div>
            ) : (
              <div style={{padding:'14px 0',fontSize:12,color:'var(--ink-muted)'}}>Predictions will appear here once signing begins.</div>
            )}
          </div>

          <div className="card">
            <div className="card-title">Recent Session</div>
            <div className="card-sub">{recent.length} confident prediction{recent.length===1?'':'s'}</div>
            {recent.length === 0 ? (
              <div style={{padding:'14px 0',fontSize:12,color:'var(--ink-muted)'}}>No confident detections yet.</div>
            ) : (
              <div className="stack" style={{gap:6}}>
                {recent.map((item, i) => (
                  <div className="list-row" key={i}>
                    <div className="mini-icon">{String(item.class_id).padStart(2,'0')}</div>
                    <div><h4>{item.label_tr}</h4><p>{item.label_en}</p></div>
                    <span className="tag gold">{Math.round(item.confidence*100)}%</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    </div></div>
  );
}

/* ============================================================
   APP ROOT — splash, persistence, routing
   ============================================================ */
function App(){
  const [splash, setSplash] = useState(true);
  const [user, setUser]       = useStoredUser();
  const [route, navigate]     = useHashRoute();
  useMouseParallax();

  useEffect(() => { const t = setTimeout(() => setSplash(false), 1700); return () => clearTimeout(t); }, []);

  const AUTH_ROUTES = new Set(['home', 'auth']);
  const VALID = new Set(['dashboard','live','avatar','avatar3d','history','settings','admin/overview','admin/users','admin/logs','admin/model','admin/dictionary','admin/system']);

  useEffect(() => {
    if (!user && !AUTH_ROUTES.has(route)) {
      navigate('home');
    } else if (user && AUTH_ROUTES.has(route)) {
      navigate(user.role === 'Admin' ? 'admin/overview' : 'dashboard');
    } else if (user && !VALID.has(route)) {
      navigate(user.role === 'Admin' ? 'admin/overview' : 'dashboard');
    }
  }, [user, route]);

  useEffect(() => {
    if (splash) document.body.classList.remove('scrollable');
  }, [splash]);

  return (
    <>
      <CustomCursor />
      {splash && <Splash />}
      {(() => {
        if (!user){
          if (route === 'auth') return <AuthScreen onAuth={u => { setUser(u); navigate(u.role === 'Admin' ? 'admin/overview' : 'dashboard'); }} onBack={() => navigate('home')} />;
          return <LandingPage onLaunch={() => navigate('auth')} />;
        }
        const meta = {
          'dashboard':        ['Dashboard',         'Overview of your platform'],
          'live':             ['Live Translation',  'Real-time camera inference'],
          'avatar':           ['Avatar Studio',     'Sign-to-animation mapping'],
          'avatar3d':         ['3D Animation',      '3D işaret dili animasyonu'],
          'history':          ['Translation History','Past predictions archive'],
          'settings':         ['Settings',          'Runtime configuration'],
          'admin/overview':   ['Admin Overview',    'System and user intelligence'],
          'admin/users':      ['User Management',   'Accounts and sessions'],
          'admin/logs':       ['Activity Log',      'Event timeline'],
          'admin/model':      ['AI Monitor',        'Model performance and telemetry'],
          'admin/dictionary': ['Sign Dictionary',   'Class mapping registry'],
          'admin/system':     ['System',            'Infrastructure status'],
        }[route] || ['SignTurk',''];

        const page = (() => {
          switch(route){
            case 'dashboard':        return <DashboardPage navigate={navigate}/>;
            case 'live':             return <LivePage/>;
            case 'avatar':           return <AvatarPage/>;
            case 'avatar3d':         return <Avatar3DPage/>;
            case 'history':          return <HistoryPage/>;
            case 'settings':         return <SettingsPage/>;
            case 'admin/overview':   return <AdminOverviewPage/>;
            case 'admin/users':      return <AdminUsersPage/>;
            case 'admin/logs':       return <AdminLogsPage/>;
            case 'admin/model':      return <AdminModelPage/>;
            case 'admin/dictionary': return <AdminDictionaryPage/>;
            case 'admin/system':     return <AdminSystemPage/>;
            default:                 return <DashboardPage navigate={navigate}/>;
          }
        })();

        return (
          <div className="app">
            <Sidebar route={route} navigate={navigate} user={user} onLogout={() => { setUser(null); navigate('home'); }}/>
            <main className="main">
              <Topbar title={meta[0]} subtitle={meta[1]} user={user} route={route}/>
              {page}
            </main>
          </div>
        );
      })()}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
